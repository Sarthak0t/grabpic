services:
  postgres:
    image: postgres:16
    container_name: grabpic-postgres
    environment:
      POSTGRES_DB: grabpic
      POSTGRES_USER: grabpic
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"  #hostport:container port
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: